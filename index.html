<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checkpoint</title>
<meta name="description" content="Plant a flag for every bit of progress, keep every word of client feedback. A private, local-first work log.">
<meta name="theme-color" content="#ECECEE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17171C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Checkpoint">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
<script>
  // Apply the saved theme before first paint.
  try {
    var t = (JSON.parse(localStorage.getItem('checkpoint.v1') || '{}').settings || {}).theme;
    if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="app">
  <nav class="side" aria-label="Main" id="side"></nav>
  <main id="view" tabindex="-1"></main>
</div>
<nav class="tabbar" aria-label="Main" id="tabbar"></nav>
<button type="button" class="fab" id="fab" aria-label="Log a checkpoint"></button>
<div id="layer"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px;font-family:system-ui">Checkpoint needs JavaScript to run.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
