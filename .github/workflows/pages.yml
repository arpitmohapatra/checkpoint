name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/quirky-cori-faoxn4]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js .nojekyll css js icons _site/
          # Stamp the service worker cache with the commit so every deploy refreshes clients.
          sed -i "s/const VERSION = 'checkpoint-v1';/const VERSION = 'checkpoint-${GITHUB_SHA::8}';/" _site/sw.js
          grep -n "const VERSION" _site/sw.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
